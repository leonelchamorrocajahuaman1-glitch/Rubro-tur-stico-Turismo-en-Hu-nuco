<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · WILD Huánuco</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/InterVariable.woff2") format("woff2"); font-weight: 400 800; }
  :root { --paper: #f1ece2; --ink: #1c211b; --ink-2: #41463e; --sunset: #c4692f; --jungle: #24402f; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; text-align: center;
    background: var(--paper); color: var(--ink);
    font-family: "Inter", system-ui, sans-serif; padding: 24px;
  }
  .big { font-size: clamp(90px, 22vw, 220px); font-weight: 800; letter-spacing: -.06em; line-height: .8; display: flex; align-items: center; justify-content: center; gap: .05em; }
  .big i { display: inline-block; width: 1.2em; height: .55em; border-radius: 999px; background: var(--jungle) url("assets/img/bella2.jpg") center / cover; }
  h1 { font-size: clamp(22px, 3vw, 32px); letter-spacing: -.03em; margin-top: 36px; }
  p { color: var(--ink-2); margin-top: 10px; }
  a { display: inline-flex; margin-top: 28px; height: 46px; align-items: center; padding: 0 24px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; }
  a:hover { background: var(--jungle); }
</style>
</head>
<body>
  <main>
    <div class="big" aria-hidden="true">4<i></i>4</div>
    <h1>Este camino no existe</h1>
    <p>La página que buscas no está aquí, pero Huánuco te espera.</p>
    <a href="./">Volver al inicio</a>
  </main>
</body>
</html>
