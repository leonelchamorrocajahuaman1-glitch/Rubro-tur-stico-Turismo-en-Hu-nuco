<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild — Travel Rentals</title>
<meta name="description" content="Wild: travel rental service. Discover breathtaking landscapes and hidden gems.">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/726b168c-da47-4682-a255-cc3e02f89bae.jpg" as="image">
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 400 800;
    font-style: normal;
    font-display: block;
  }

  :root {
    --page: #ffffff;
    --paper: #f2f2f1;
    --ink: #1d1d1d;
    --ink-2: #3a3a3a;
    --rule: #a9a9a6;
    --btn: #1b1b1b;
    --pill-fill: #d8d3cf;
    --hair: #b9b9b9;
    --fs: min(19.6vh, 13.2vw);
    --side: calc(var(--fs) * 0.27);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- background ---------- */
  .paper {
    position: fixed;
    inset: 0;
    background: var(--paper);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  .paper svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .paper path { fill: none; stroke: #fff; stroke-linecap: round; vector-effect: non-scaling-stroke; }

  /* ---------- nav ---------- */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--fs) * 0.14) var(--side) 0;
    font-size: max(12px, calc(var(--fs) * 0.072));
    font-weight: 450;
    letter-spacing: -0.005em;
    z-index: 3;
    transform: translateY(-140%);
  }
  .nav ul { display: flex; list-style: none; gap: 2.1em; }
  .nav a { transition: opacity .2s; }
  .nav a:hover { opacity: .55; }
  .nav a:focus-visible, .btn:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px;
  }

  /* ---------- hero ---------- */
  .hero {
    position: fixed;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    font-size: var(--fs);
    gap: 0.026em;
    z-index: 2;
  }
  .word {
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.8;
    white-space: nowrap;
    color: var(--ink);
    user-select: none;
  }
  .word.wi { padding-right: 0.045em; } /* re-balance trailing tracking */

  .pill {
    position: relative;
    flex: none;
    height: 1.81em;
    width: 0.012em;
    border-radius: 999px;
    overflow: hidden;
    background: var(--pill-fill);
    clip-path: inset(50% 0);
    isolation: isolate;
  }
  .pill video {
    position: absolute;
    top: 0;
    left: 50%;
    height: 100%;
    width: 4.2em;
    transform: translateX(-50%);
    object-fit: cover;
    object-position: center top;
    display: block;
    background: var(--pill-fill) url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/726b168c-da47-4682-a255-cc3e02f89bae.jpg") center top / cover no-repeat;
  }
  .hairline {
    position: absolute;
    inset: 0;
    background: var(--hair);
    z-index: 1;
  }
  .icon-btn {
    position: absolute;
    top: 50%;
    width: 0.13em;
    height: 0.13em;
    min-width: 22px; min-height: 22px;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    color: #fff;
    opacity: 0;
    z-index: 2;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .icon-btn svg * { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .icon-breeze { left: 0.2em; cursor: default; }
  .icon-sound { right: 0.2em; }
  .icon-sound .waves { transition: opacity .25s; }
  .icon-sound[aria-pressed="false"] .waves { opacity: 0; }

  /* ---------- footer ---------- */
  .foot {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: flex-end;
    gap: calc(var(--fs) * 0.16);
    padding: 0 var(--side) calc(var(--fs) * 0.16);
    z-index: 3;
    transform: translateY(160%);
  }
  .foot p {
    flex: none;
    width: calc(var(--fs) * 1.42);
    font-size: max(11px, calc(var(--fs) * 0.066));
    line-height: 1.45;
    color: var(--ink-2);
    font-weight: 400;
  }
  .foot p::first-letter {
    float: left;
    font-size: 2.35em;
    line-height: 0.86;
    font-weight: 650;
    color: var(--ink);
    padding: 0.06em 0.08em 0 0;
  }
  .rule {
    flex: 1;
    height: 1px;
    background: var(--rule);
    margin-bottom: calc(var(--fs) * 0.13);
    transform: scaleX(0);
    transform-origin: center;
  }
  .btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: max(38px, calc(var(--fs) * 0.26));
    padding: 0 1.6em;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: #fff;
    font: inherit;
    font-size: max(13px, calc(var(--fs) * 0.075));
    font-weight: 550;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform .2s, background .2s;
  }
  .btn:hover { background: #000; transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.98); }

  /* ---------- phone ---------- */
  @media (max-width: 720px) {
    :root { --fs: min(34vw, 16.5vh); --side: 20px; }
    .nav { padding: 18px 20px 0; font-size: 12.5px; }
    .nav ul { gap: 1.25em; }
    .nav .social { display: none; }

    .hero {
      top: 47%;
      flex-direction: column;
      gap: 0.03em;
    }
    .word.wi { padding-right: 0; }
    .pill {
      width: calc(100vw - 40px);
      height: 1.5px;
      clip-path: inset(0 50%);
    }
    .pill video {
      top: 50%;
      left: 0;
      width: 100%;
      height: calc((100vw - 40px) / 1.85);
      transform: translateY(-50%);
    }
    .icon-btn { width: 20px; height: 20px; }
    .icon-breeze { left: 18px; }
    .icon-sound { right: 18px; }

    .foot {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 0 20px 20px;
    }
    .foot p { width: 100%; font-size: 13px; line-height: 1.5; }
    .foot .row { display: flex; align-items: center; gap: 16px; }
    .rule { margin-bottom: 0; }
    .btn { height: 38px; font-size: 13px; padding: 0 18px; }
  }
  @media (min-width: 721px) {
    .foot .row { display: contents; }
  }
</style>
</head>
<body>
  <div class="paper" aria-hidden="true">
    <svg id="lines" viewBox="0 0 1440 960" preserveAspectRatio="none"></svg>
  </div>

  <nav class="nav" aria-label="Main">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">Templates</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
    <ul class="social">
      <li><a href="#">Instagram</a></li>
      <li><a href="#">Facebook</a></li>
    </ul>
  </nav>

  <main>
    <h1 class="hero" aria-label="Wild">
      <span class="word wi" aria-hidden="true">WI</span>
      <span class="pill" id="pill">
        <video id="scene" muted loop playsinline autoplay preload="auto"
               poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/726b168c-da47-4682-a255-cc3e02f89bae.jpg"
               src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/175fbbcd-e50a-480c-bab2-ca16d4678322.mp4"
               aria-label="A floating island with a waterfall above sunset clouds"></video>
        <span class="hairline" id="hairline"></span>
        <span class="icon-btn icon-breeze" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 8h10.5a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12h15.5a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 16h7"/></svg>
        </span>
        <button class="icon-btn icon-sound" id="sound" type="button" aria-pressed="true" aria-label="Toggle sound icon">
          <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="waves"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></g></svg>
        </button>
      </span>
      <span class="word ld" aria-hidden="true">LD</span>
    </h1>
  </main>

  <footer class="foot">
    <p>Embark on a wild ride around the world with our travel rental service. Discover breathtaking landscapes and hidden gems on your unforgettable journey.</p>
    <div class="row">
      <span class="rule" id="rule" aria-hidden="true"></span>
      <button class="btn" id="replay" type="button">Let’s Get Wild</button>
    </div>
  </footer>

<script>
(() => {
  "use strict";

  const DUR = 2100;
  const CLIP_DUR = 4.25;
  const $ = (s) => document.querySelector(s);
  const pill = $("#pill"), hairline = $("#hairline"), hero = $(".hero");
  const nav = $(".nav"), foot = $(".foot"), paper = $(".paper"), rule = $("#rule");
  const video = $("#scene");
  const icons = document.querySelectorAll(".icon-btn");
  const phoneMQ = matchMedia("(max-width: 720px)");
  const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
  const params = new URLSearchParams(location.search);
  const REC = params.get("rec") === "1";

  /* ---------- background strokes ---------- */
  (function drawLines() {
    const svg = $("#lines");
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const N = 15;
    let out = "";
    for (let i = 0; i < N; i++) {
      const sx = -520 + i * 118 + (rnd() - 0.5) * 60;
      const ex = sx + 780 + rnd() * 180;
      const c1x = sx + 520 + rnd() * 140, c1y = 700 + rnd() * 90;
      const c2x = sx + 160 + rnd() * 160, c2y = 240 + rnd() * 90;
      const w = (1.2 + rnd() * 2.7).toFixed(2);
      const o = (0.55 + rnd() * 0.30).toFixed(2);
      out += `<path d="M${sx.toFixed(1)} 1000 C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${ex.toFixed(1)} -40" stroke-width="${w}" stroke-opacity="${o}"/>`;
    }
    svg.innerHTML = out;
  })();

  /* ---------- timeline ---------- */
  const E1 = "cubic-bezier(.5,0,.3,1)";
  const E2 = "cubic-bezier(.45,0,.3,1)";
  const E3 = "cubic-bezier(.4,0,.2,1)";
  const EDROP = "cubic-bezier(.2,.8,.2,1)";
  const EASE = "cubic-bezier(.4,0,.2,1)";

  function pillFrames(phone) {
    if (phone) {
      const H = "((100vw - 40px) / 1.85)";
      return [
        { height: "1.5px", offset: 0 },
        { height: "1.5px", offset: 0.14, easing: E1 },
        { height: `calc(${H} * 0.10)`, offset: 0.30, easing: E2 },
        { height: `calc(${H} * 0.55)`, offset: 0.58, easing: E3 },
        { height: `calc(${H} * 1)`, offset: 1 }
      ];
    }
    return [
      { width: "0.012em", offset: 0 },
      { width: "0.012em", offset: 0.14, easing: E1 },
      { width: "0.16em", offset: 0.30, easing: E2 },
      { width: "1.81em", offset: 0.58, easing: E3 },
      { width: "3.62em", offset: 1 }
    ];
  }

  function build() {
    const phone = phoneMQ.matches;
    const opts = { duration: DUR, fill: "both" };
    const clipFrom = phone ? "inset(0% 50%)" : "inset(50% 0%)";
    const gapFrames = phone
      ? [{ gap: "0.03em", offset: 0 }, { gap: "0.03em", offset: 0.14, easing: E2 }, { gap: "0.065em", offset: 0.58, easing: E3 }, { gap: "0.1em", offset: 1 }]
      : [{ gap: "0.026em", offset: 0 }, { gap: "0.026em", offset: 0.14, easing: E2 }, { gap: "0.05em", offset: 0.58, easing: E3 }, { gap: "0.085em", offset: 1 }];

    const list = [
      pill.animate(pillFrames(phone), opts),
      pill.animate([
        { clipPath: clipFrom, offset: 0, easing: EASE },
        { clipPath: "inset(0% 0%)", offset: 0.14 },
        { clipPath: "inset(0% 0%)", offset: 1 }
      ], opts),
      hairline.animate([
        { opacity: 1, offset: 0 }, { opacity: 1, offset: 0.14, easing: "ease-in-out" },
        { opacity: 0, offset: 0.30 }, { opacity: 0, offset: 1 }
      ], opts),
      hero.animate(gapFrames, opts),
      paper.animate([
        { opacity: 0, offset: 0 }, { opacity: 0, offset: 0.45, easing: "ease-in-out" },
        { opacity: 1, offset: 0.78 }, { opacity: 1, offset: 1 }
      ], opts),
      nav.animate([
        { transform: "translateY(-140%)", offset: 0 }, { transform: "translateY(-140%)", offset: 0.50, easing: EDROP },
        { transform: "translateY(0)", offset: 0.86 }, { transform: "translateY(0)", offset: 1 }
      ], opts),
      foot.animate([
        { transform: "translateY(160%)", offset: 0 }, { transform: "translateY(160%)", offset: 0.52, easing: EDROP },
        { transform: "translateY(0)", offset: 0.90 }, { transform: "translateY(0)", offset: 1 }
      ], opts),
      rule.animate([
        { transform: "scaleX(0)", offset: 0 }, { transform: "scaleX(0)", offset: 0.40, easing: EASE },
        { transform: "scaleX(1)", offset: 0.95 }, { transform: "scaleX(1)", offset: 1 }
      ], opts),
      ...[...icons].map((el) => el.animate([
        { opacity: 0, offset: 0 }, { opacity: 0, offset: 0.80, easing: "ease-out" }, { opacity: 0.85, offset: 1 }
      ], opts))
    ];
    list.forEach((a) => a.pause());
    return { phone, list };
  }

  let tl = null;
  let busy = false;
  let token = 0;

  const setTime = (t) => tl.list.forEach((a) => (a.currentTime = t));
  function run(rate) {
    tl.list.forEach((a) => { a.playbackRate = rate; a.play(); });
    return Promise.all(tl.list.map((a) => a.finished)).catch(() => {});
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function open() {
    const my = ++token;
    busy = true;
    setTime(0);
    await run(1);
    if (my === token) busy = false;
  }

  async function collapse() {
    const my = ++token;
    busy = true;
    setTime(DUR);
    await run(-1);
    if (my !== token) return false;
    return true;
  }

  async function replay() {
    if (busy || reduceMQ.matches) return;
    const ok = await collapse();
    if (!ok) return;
    await wait(260);
    if (busy && tl) open();
  }

  function settle() {
    // finish whatever is running and snap to the opened state
    token++;
    busy = false;
    if (tl) tl.list.forEach((a) => a.cancel());
    tl = build();
    tl.list.forEach((a) => { a.playbackRate = 1; a.finish(); });
  }

  /* ---------- interaction ---------- */
  $("#replay").addEventListener("click", replay);

  $("#sound").addEventListener("click", (e) => {
    const b = e.currentTarget;
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    video.muted = true; // the clip is silent
  });

  let rAF = 0;
  addEventListener("resize", () => {
    cancelAnimationFrame(rAF);
    rAF = requestAnimationFrame(settle);
  });

  /* ---------- video ---------- */
  function setupVideo() {
    video.muted = true;
    if (reduceMQ.matches) {
      video.removeAttribute("autoplay");
      video.pause();
      return;
    }
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  }

  window.__recVideo = (t) => {
    const d = isFinite(video.duration) && video.duration > 0 ? video.duration : CLIP_DUR;
    return (((t % d) + d) % d) + 1 / 120;
  };

  /* ---------- start ---------- */
  async function start() {
    tl = build();
    setupVideo();
    if (reduceMQ.matches) {
      tl.list.forEach((a) => a.finish());
      return;
    }
    if (REC) {
      open();
      setTimeout(() => collapse(), 4900);
      return;
    }
    open();
  }

  tl = build(); // lock in the t=0 state immediately
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, wait(2500)]).then(() => {
    tl.list.forEach((a) => a.cancel());
    start();
  });
})();
</script>
</body>
</html>
